# fill in environment values (either .env or in docker-compose)
# docker compose pull
# docker compose up

services:

  dualis-api-service:
    image: ghcr.io/weltraumlama/dualis-api-grade-watcher/dualis-api-service:latest
    container_name: dualis-api-service
    restart: unless-stopped
    ports:
      - "8330:8330"
    networks:
      - dualis-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8330/docs')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  notification-service:
    image: ghcr.io/weltraumlama/dualis-api-grade-watcher/notification-service:latest
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8332:8332"
    environment:
      - TELEGRAM_BOT_TOKEN=
      - TELEGRAM_CHAT_ID=
      - PORT=8332
    networks:
      - dualis-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8332/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  refresh-service:
    image: ghcr.io/weltraumlama/dualis-api-grade-watcher/refresh-service:latest
    container_name: refresh-service
    restart: unless-stopped
    ports:
      - "8331:8331"
    environment:
      - DUALIS_USER=
      - DUALIS_PASSWORD=
      - REFRESH_INTERVAL_SECONDS=300
      - PORT=8331
      # specify SEMESTER_ID or leave it empty for latest
      - SEMESTER_ID=
      - STATE_FILE=grades_state.json
      # Override URLs to use Docker-internal hostnames
      - DUALIS_API_URL=http://dualis-api-service:8330
      - WEBHOOK_URL=http://notification-service:8332/new-grade
    volumes:
      - refresh-state:/app/state
    depends_on:
      dualis-api-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - dualis-net

volumes:
  refresh-state:
    driver: local

networks:
  dualis-net:
    driver: bridge